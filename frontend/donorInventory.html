<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Inventory | MediConnect</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="./css/style.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
<div class="bg-blobs"></div>
<div id="navbar"></div>

<div class="container py-5" style="margin-top: 2rem;">
    <div class="row align-items-center mb-4">
        <div class="col-md-8">
            <h2 class="mb-1 fw-bold text-gradient">Donor Dashboard</h2>
            <p class="text-muted small mb-0">Monitor your analytics and manage your medicine catalog.</p>
        </div>
        <div class="col-md-4 text-md-end mt-3 mt-md-0">
            <a href="addMedicine.html" class="btn btn-primary shadow-sm w-100 w-md-auto"><i class="fas fa-plus me-2"></i>Add Medicine</a>
        </div>
    </div>

    <!-- Summary Stat Cards -->
    <div class="row g-4 mb-5">
        <div class="col-md-3">
            <div class="stat-card">
                <div class="stat-icon blue"><i class="fas fa-boxes"></i></div>
                <div>
                    <h3 class="stat-value" id="statTotal">0</h3>
                    <p class="stat-label">Total Medicines</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <div class="stat-icon emerald"><i class="fas fa-box-open"></i></div>
                <div>
                    <h3 class="stat-value" id="statAvailable">0</h3>
                    <p class="stat-label">Available</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(255, 193, 7, 0.1); color: #ffc107;"><i class="fas fa-exclamation-triangle"></i></div>
                <div>
                    <h3 class="stat-value" id="statExpiring">0</h3>
                    <p class="stat-label">Near Expiry</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(220, 53, 69, 0.1); color: #dc3545;"><i class="fas fa-times-circle"></i></div>
                <div>
                    <h3 class="stat-value" id="statExpired">0</h3>
                    <p class="stat-label">Expired</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Search and Filters -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
                <input type="text" id="searchInput" class="form-control border-start-0 ps-0" placeholder="Search by medicine name or batch...">
            </div>
        </div>
        <div class="col-md-3">
            <select id="expiryFilter" class="form-select">
                <option value="All">All Expiry Status</option>
                <option value="available">Available</option>
                <option value="near_expiry">Near Expiry</option>
                <option value="expired">Expired</option>
            </select>
        </div>
        <div class="col-md-3">
            <select id="categoryFilter" class="form-select">
                <option value="All">All Categories</option>
                <!-- Categories loaded via JS -->
            </select>
        </div>
    </div>

    <div class="card border-0 p-1">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                    <tr>
                        <th class="px-4">Medicine Name</th>
                        <th>Batch</th>
                        <th>Status</th>
                        <th>Quantity</th>
                        <th class="px-4">Category</th>
                    </tr>
                </thead>
                <tbody id="inventoryTable">
                    <!-- Loaded via JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="./js/donorInventory.js"></script>
<script src="./js/navbar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
